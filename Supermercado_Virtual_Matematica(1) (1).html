<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supermercado Virtual - Matemática</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f7f7fb;color:#222}
header{background:linear-gradient(135deg,#7b2cbf,#c77dff);color:white;padding:24px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(26px,5vw,42px)}
header p{margin:0;font-size:17px}
main{max-width:1050px;margin:22px auto;padding:0 14px}
.card{background:white;border-radius:18px;padding:20px;box-shadow:0 5px 18px #00000015;margin-bottom:18px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:bold;cursor:pointer;background:#7b2cbf;color:white}
button:hover{filter:brightness(1.08)}
button.secondary{background:#555}
button.light{background:#eee;color:#222}
.level{min-height:86px}
.hidden{display:none}
.question{font-size:22px;font-weight:bold;margin:10px 0 18px}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.option{background:#f1e8ff;color:#4a148c;border:2px solid #dec7ff}
.feedback{margin-top:15px;padding:13px;border-radius:12px;font-weight:bold}
.ok{background:#e8f7e8;color:#176b17}
.no{background:#fff0f0;color:#a11}
.stats{display:flex;gap:15px;flex-wrap:wrap;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.product{border:2px solid #eee;border-radius:14px;padding:14px;text-align:center;background:#fff}
.product .emoji{font-size:40px}
.product h3{margin:7px 0}
.product button{width:100%;margin-top:8px}
.cart{background:#faf5ff;border:2px dashed #c9a5ef;padding:14px;border-radius:14px}
.cart-row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #e4d8ef}
.big{font-size:26px;font-weight:bold}
input{font-size:20px;padding:10px;border:2px solid #ccc;border-radius:10px;width:180px}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;margin:3px}
footer{text-align:center;padding:25px;color:#666;font-size:14px}
@media(max-width:600px){.question{font-size:19px}}
</style>
</head>
<body>
<header>
<h1>🛒 Supermercado Virtual</h1>
<p>Aprendendo Matemática brincando!</p>
</header>

<main>
<div class="card" id="home">
<h2>Escolha a turma</h2>
<p>Atividades pensadas para o Ensino Fundamental – 1º ao 5º ano.</p>
<div class="levels">
<button class="level" onclick="start(1)">🪙 1º ano<br><small>Moedas e cédulas</small></button>
<button class="level" onclick="start(2)">💰 2º ano<br><small>Formando valores</small></button>
<button class="level" onclick="start(3)">🛍️ 3º ano<br><small>Compras</small></button>
<button class="level" onclick="start(4)">🧾 4º ano<br><small>Troco</small></button>
<button class="level" onclick="start(5)">🔢 5º ano<br><small>Preços e descontos</small></button>
</div>
</div>

<div class="card hidden" id="game">
<div class="stats"><span id="levelName"></span><span>⭐ Pontos: <span id="score">0</span></span><span>🎯 Rodada: <span id="round">1</span>/5</span></div>
<hr>
<div id="content"></div>
<button class="secondary" onclick="backHome()">↩ Escolher outra turma</button>
</div>
</main>

<footer>Supermercado Virtual – atividade educativa de Matemática.</footer>

<script>
let level=1,score=0,round=1,mode='quiz',current=null,cart=[];

const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});

const quizzes={
1:[
['Qual moeda tem o valor de R$ 1,00?',['R$ 0,10','R$ 0,50','R$ 1,00','R$ 2,00'],2],
['Qual cédula vale R$ 5,00?',['R$ 2,00','R$ 5,00','R$ 10,00','R$ 20,00'],1],
['Qual é o maior valor?',['R$ 0,50','R$ 1,00','R$ 0,25','R$ 0,10'],1],
['Duas moedas de R$ 0,50 formam:',['R$ 0,50','R$ 1,00','R$ 1,50','R$ 2,00'],1],
['Qual cédula vem depois de R$ 10,00?',['R$ 2,00','R$ 5,00','R$ 20,00','R$ 50,00'],2]],
2:[
['Quanto é R$ 1,00 + R$ 1,00?',['R$ 1,00','R$ 2,00','R$ 3,00','R$ 10,00'],1],
['Quanto formam duas moedas de R$ 0,25?',['R$ 0,25','R$ 0,50','R$ 0,75','R$ 1,00'],1],
['Qual conjunto forma R$ 2,00?',['2 moedas de R$ 0,50','4 moedas de R$ 0,25','2 moedas de R$ 1,00','1 moeda de R$ 0,25'],2],
['R$ 5,00 + R$ 2,00 =',['R$ 6,00','R$ 7,00','R$ 8,00','R$ 9,00'],1],
['R$ 10,00 - R$ 5,00 =',['R$ 2,00','R$ 3,00','R$ 5,00','R$ 10,00'],2]]
};

const products=[
['🍎','Maçã',2.50],['🥛','Leite',4.50],['🍞','Pão',3.00],['🧃','Suco',5.50],
['🍪','Biscoito',4.00],['🧀','Queijo',8.50],['🍌','Banana',3.50],['🥚','Ovos',7.00]
];

function start(l){
 level=l;score=0;round=1;cart=[];
 document.getElementById('home').classList.add('hidden');
 document.getElementById('game').classList.remove('hidden');
 document.getElementById('levelName').textContent=level+'º ano';
 document.getElementById('score').textContent=score;
 document.getElementById('round').textContent=round;
 if(level<=2) quiz();
 else shopping();
}
function backHome(){document.getElementById('game').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}

function quiz(){
 let q=quizzes[level][round-1]; current=q;
 document.getElementById('content').innerHTML=`<div class="question">🛒 ${q[0]}</div>
 <div class="options">${q[1].map((x,i)=>`<button class="option" onclick="answer(${i})">${x}</button>`).join('')}</div>
 <div id="feedback"></div>`;
}
function answer(i){
 let fb=document.getElementById('feedback');
 if(i===current[2]){
  score+=10; fb.className='feedback ok'; fb.textContent='✅ Muito bem! Resposta correta!';
 }else{fb.className='feedback no';fb.textContent='❌ Vamos tentar aprender com esta resposta. A correta é: '+current[1][current[2]]+'.'}
 document.getElementById('score').textContent=score;
 document.querySelectorAll('.option').forEach(b=>b.disabled=true);
 if(round<5){setTimeout(()=>{round++;document.getElementById('round').textContent=round;quiz()},900)}
 else{setTimeout(finish,900)}
}
function finish(){
 document.getElementById('content').innerHTML=`<div class="question">🎉 Fim da atividade!</div>
 <p class="big">Você fez ${score} pontos.</p><p>Parabéns por participar do Supermercado Virtual!</p>
 <button onclick="start(level)">🔄 Jogar novamente</button>`;
}

function shopping(){
 cart=[];
 let title=level===3?'🛍️ Faça suas compras':level===4?'🧾 Compre e descubra o troco':'🔢 Compre e calcule o desconto';
 document.getElementById('content').innerHTML=`<h2>${title}</h2>
 <p>Escolha os produtos para colocar no carrinho.</p>
 <div class="products">${products.map((p,i)=>`<div class="product"><div class="emoji">${p[0]}</div><h3>${p[1]}</h3><div>${money(p[2])}</div><button onclick="add(${i})">Adicionar</button></div>`).join('')}</div>
 <div class="cart" style="margin-top:18px"><h3>🛒 Carrinho</h3><div id="cartItems">Nenhum produto ainda.</div>
 <p class="big">Total: <span id="total">${money(0)}</span></p>
 <button onclick="checkout()">Finalizar compra</button></div>`;
}
function add(i){cart.push(products[i]);renderCart()}
function renderCart(){
 let total=cart.reduce((s,p)=>s+p[2],0);
 document.getElementById('cartItems').innerHTML=cart.length?cart.map(p=>`<div class="cart-row"><span>${p[0]} ${p[1]}</span><b>${money(p[2])}</b></div>`).join(''):'Nenhum produto ainda.';
 document.getElementById('total').textContent=money(total);
}
function checkout(){
 if(!cart.length){alert('Escolha pelo menos um produto.');return}
 let total=cart.reduce((s,p)=>s+p[2],0);
 if(level===3){
  let answer=prompt('Quanto você deverá pagar? Digite o valor em reais. Ex.: 15,50');
  let n=parseFloat((answer||'').replace(',','.'));
  if(Math.abs(n-total)<0.011){score+=10;alert('✅ Correto! Total: '+money(total));}
  else alert('O total correto é '+money(total)+'.');
 }else if(level===4){
  let answer=prompt('Você pagará R$ 50,00. Quanto deverá receber de troco?');
  let troco=50-total,n=parseFloat((answer||'').replace(',','.'));
  if(Math.abs(n-troco)<0.011){score+=10;alert('✅ Correto! Troco: '+money(troco));}
  else alert('O troco correto é '+money(troco)+'.');
 }else{
  let answer=prompt('Imagine que a compra terá 10% de desconto. Qual será o valor final?');
  let final=total*0.9,n=parseFloat((answer||'').replace(',','.'));
  if(Math.abs(n-final)<0.011){score+=10;alert('✅ Correto! Com 10% de desconto: '+money(final));}
  else alert('O valor correto é '+money(final)+'.');
 }
 document.getElementById('score').textContent=score;
 round++;
 if(round<=5){document.getElementById('round').textContent=round;shopping();}
 else finish();
}
</script>
</body>
</html>
